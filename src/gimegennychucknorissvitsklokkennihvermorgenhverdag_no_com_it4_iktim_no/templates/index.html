<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gradient {
            background: linear-gradient(to bottom, rgb(3, 3, 3)0%,rgb(50,50,50)80%,rgb(116, 115, 115));
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            top: 0;
            left: 0;
        }

        .center {
            text-align: center;
            align-items: center;
            margin: auto;
        }
        .box {
            width: 67%;
            margin: auto;
            background: linear-gradient(to bottom, rgb(25,25,25),rgb(50,50,50));
            border-radius: 10px;
            padding: 20px;
            outline: 1px solid rgb(138, 138, 138);
        }
        h1 {
            color: rgb(255, 255, 255);
        }
        h2 {
            color: white;
        }
        div {
            color: white;
        }
    </style>
</head>
<body>
    <div class="gradient">
        <div class="center">
            <h1>Chuck Norris Joke of the Day!</h1>
            <div class="box">
                <h2>{{joke}}</h2>
            </div>
            <h2>Time remaining until next Chuck Norris joke:</h2>
            <div id="countdown">Calculating...</div>
        </div>
    </div>
    <script>
        (function () {
            var el = document.getElementById("countdown");
            var end = null;

            function pad(n) { return String(n).padStart(2, "0"); }

            function tick() {
                if (end === null) return;
                var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
                el.textContent = pad(Math.floor(left / 3600)) + ":" + pad(Math.floor(left % 3600 / 60)) + ":" + pad(left % 60);
                if (left === 0) {
                    end = null;
                    setTimeout(function () { location.reload(); }, 1500);
                }
            }

            function sync() {
                fetch("/seconds-until-next-joke")
                    .then(function (r) { return r.json(); })
                    .then(function (d) { end = Date.now() + d.seconds * 1000; tick(); })
                    .catch(function () { setTimeout(sync, 10000); });
            }

            setInterval(tick, 1000);
            sync();
        })();
    </script>
</body>
</html>
