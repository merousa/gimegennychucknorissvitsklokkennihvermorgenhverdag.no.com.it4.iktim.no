<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gradient {
            background: linear-gradient(to bottom, rgb(3, 3, 3)0%,rgb(50,50,50)80%,rgb(116, 115, 115));
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            top: 0;
            left: 0;
        }

        .center {
            text-align: center;
            align-items: center;
            margin: auto;
        }

        h1 {
            color: rgb(255, 255, 255);
        }
        h2 {
            color: white;
        }
        div {
            color: white;
        }
    </style>
</head>
<body>
    <div class="gradient">
        <div class="center">
            <h1>Chuck Norris Joke of the Day!</h1>
            <h2 id="joke">Loading joke...</h2>
            <h2>Time remaining until next Chuck Norris joke:</h2>
            <div id="countdown">Calculating...</div>
            <script>
                function fetchNewJoke() {
                    const jokeURL = "https://api.chucknorris.io/jokes/random";
                    fetch(jokeURL)
                        .then(response => response.json())
                        .then(data => {
                            jokeElement.innerHTML = data.value;
                            localStorage.setItem("joke", data.value);
                            localStorage.setItem("jokeExpiry",targetTime);
                        })
                        .catch(error => {
                            jokeElement.innerHTML = "Chuck Norris blocked the API request!";
                            console.error(error);
                        })
                }
                function getTime() {
                    const target = new Date();
                    target.setHours(9,0,0,0)
                    if (new Date() >= target) {
                        target.setDate(target.getDate() + 1);
                    }
                    return target.getTime();
                }

                function init() {
                    const nextExpiry = getTime();

                    const storedJoke = localStorage.getItem("joke");
                    const storedExpiry = localStorage.getItem("jokeExpiry");
                    const now = new Date().getTime();

                    if (!storedJoke || !storedExpiry || now >= storedExpiry) {
                        fetchNewJoke();
                    } else {
                        jokeElement.innerHTML = storedJoke;
                    }
                    startCountdown();
                }

                function startCountdown() {
                    const countdownInterval = setInterval(function() {
                        const now = new Date().getTime();
                        const distance = targetTime - now;
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                        countdownElement.innerHTML = hours + "h " + minutes + "m " + seconds + "s ";
                        if (distance < 0) {
                            clearInterval(countdownInterval);
                            countdownElement.innerHTML = "It's time for a new Chuck Norris joke!";
                        }
                    },1000);
                }

                const countdownElement = document.getElementById("countdown");
                const jokeElement = document.getElementById("joke");
                const targetTime = getTime();

                init();
            </script>
        </div>
    </div>
</body>
</html>
