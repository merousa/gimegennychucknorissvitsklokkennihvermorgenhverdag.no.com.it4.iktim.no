<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gradient {
            background: linear-gradient(to bottom, rgb(3, 3, 3)0%,rgb(50,50,50)80%,rgb(116, 115, 115));
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            top: 0;
            left: 0;
        }

        .center {
            text-align: center;
            align-items: center;
            margin: auto;
        }

        h1 {
            color: rgb(255, 255, 255);
        }
        h2 {
            color: white;
        }
        div {
            color: white;
        }
    </style>
</head>
<body>
    <div class="gradient">
        <div class="center">
            <h1>Chuck Norris Joke of the Day!</h1>
            <h2 id="joke">Loading joke...</h2>
            <h2>Time remaining until next Chuck Norris joke:</h2>
            <div id="countdown">Calculating...</div>
        </div>
    </div>
</body>
</html>
