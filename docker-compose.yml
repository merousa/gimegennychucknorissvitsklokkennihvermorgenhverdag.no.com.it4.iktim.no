services:
  chuck-norris-app:
    build: .
    container_name: chuck-norris-app
    restart: unless-stopped
    environment:
      TZ: Europe/Oslo
    volumes:
      - ./jokeVault:/app/jokeVault
    expose:
      - "5000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
